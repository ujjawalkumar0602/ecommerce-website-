<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 16px;
  }
  #products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
  }
  .card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
}
.card h3 { margin: 0 0 8px; }
  .card p { margin: 0 0 12px; color: #555; }
  button {
    background: #523aed;
    color: white;
    border: 0;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  #cart {
    background: white;
    padding: 12px 12px 12px 32px;
    border-radius: 10px;
  }
  #cart li { margin: 8px 0; }
  #cart button { background: #c0392b; padding: 4px 10px; margin-left: 8px; }
  #total { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
  <h1>My Shop</h1>

  <h2>Products</h2>
  <div id="products"></div>

  <h2>Cart</h2>
  <ul id="cart"></ul>
  <p id="total">Total: ₹0</p>
  <script>
const products = [
  { id: 1, name: "T-Shirt", price: 499, image: "images/tshirt.jpg" },
  { id: 2, name: "Headphones", price: 1299, image: "images/headphones.jpg" },
  { id: 3, name: "Backpack", price: 899, image: "images/backpack.jpg" },
  { id: 4, name: "Water Bottle", price: 349, image: "images/bottle.jpg" },
  { id: 5, name: "Sneakers", price: 1999, image: "images/sneakers.jpg" },
  { id: 6, name: "Watch", price: 1499, image: "images/watch.jpg" }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const productsDiv = document.getElementById("products");
const cartList = document.getElementById("cart");
const totalText = document.getElementById("total");

function showProducts() {
  products.forEach(function (p) {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image;
    img.alt = p.name;

    const title = document.createElement("h3");
    title.textContent = p.name;

    const price = document.createElement("p");
    price.textContent = "₹" + p.price;

    const btn = document.createElement("button");
    btn.textContent = "Add to Cart";
    btn.onclick = function () {
      cart.push(p);
      showCart();
    };

    card.append(img, title, price, btn);
    productsDiv.appendChild(card);
  });
}

function showCart() {
  cartList.innerHTML = "";
  let total = 0;

  cart.forEach(function (item, i) {
    total += item.price;

    const li = document.createElement("li");
    li.textContent = item.name + " - ₹" + item.price + " ";

    const remove = document.createElement("button");
    remove.textContent = "Remove";
    remove.onclick = function () {
      cart.splice(i, 1);
      showCart();
    };

    li.appendChild(remove);
    cartList.appendChild(li);
  });

  totalText.textContent = "Total: ₹" + total;
  localStorage.setItem("cart", JSON.stringify(cart));
}

showProducts();
showCart();
</script>
</body>
</html>
